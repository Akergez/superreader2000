name: Build and release

on:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
  # Gradle reads tresse-kmp from GitHub Packages, which needs a token even for public packages.
  GITHUB_TOKEN: ${{ github.token }}
  # Baked into the app as the default Tresse sync server (see TRESSE_SERVER_URL
  # in shared/build.gradle.kts): prefilled on the Sync screen, the user may replace it.
  TRESSE_SERVER_URL: ${{ vars.TRESSE_SERVER_URL }}
  # Desktop packages bundle this JDK as their runtime, so it stays pinned.
  DESKTOP_JAVA_VERSION: "21.0.5+11"
  # GitLab pipelines stopped at #98; Android versionCode has to keep growing past that.
  VERSION_CODE_OFFSET: 100

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          echo "version=${TAG:-${GITHUB_SHA::8}}" >> "$GITHUB_OUTPUT"
          echo "version_code=$((GITHUB_RUN_NUMBER + VERSION_CODE_OFFSET))" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Android Build
  # ===========================================================================
  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      APP_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :superreader2000:assembleRelease
      - uses: actions/upload-artifact@v6
        with:
          name: apk
          path: superreader2000/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # Linux RPM Build (x86_64, arm64)
  # ===========================================================================
  build-linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    name: build-linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Install build dependencies
        run: dnf install -y git rpm-build curl binutils tar gzip unzip findutils libX11 libXcursor libXrandr libXinerama libXi libXrender mesa-libEGL mesa-libGL
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.DESKTOP_JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v5
      - name: Build RPM
        run: ./gradlew desktopApp:packageReleaseRpm
      - uses: actions/upload-artifact@v6
        with:
          name: rpm-${{ matrix.arch }}
          path: desktopApp/build/compose/binaries/main-release/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # macOS DMG Build (arm64)
  # ===========================================================================
  build-macos:
    needs: prepare
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.DESKTOP_JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v5
      - name: Build app bundle
        run: ./gradlew :desktopApp:createDistributable
      - name: Create DMG
        run: |
          APP_BUNDLE=$(find desktopApp/build/compose/binaries/main/app -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_BUNDLE"
          STAGING=$(mktemp -d)
          ditto "$APP_BUNDLE" "$STAGING/$(basename "$APP_BUNDLE")"
          ln -s /Applications "$STAGING/Applications"
          mkdir -p desktopApp/build/compose/binaries/main/dmg
          hdiutil create -volname "SuperReader2000" -srcfolder "$STAGING" -ov -format UDZO "desktopApp/build/compose/binaries/main/dmg/SuperReader2000-${APP_VERSION}.dmg"
      - uses: actions/upload-artifact@v6
        with:
          name: dmg
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # Collect packages; on a tag, publish them as a GitHub Release
  # ===========================================================================
  publish:
    needs: [prepare, build-android, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Rename packages
        run: |
          mkdir dist
          cp artifacts/apk/*.apk "dist/SuperReader2000-${VERSION}.apk"
          for file in artifacts/rpm-*/*.rpm; do
            arch=$(basename "$file" | grep -oE "x86_64|aarch64")
            cp "$file" "dist/SuperReader2000-${VERSION}-${arch}-rpm.rpm"
          done
          cp artifacts/dmg/*.dmg "dist/SuperReader2000-${VERSION}-macOS.dmg"
          ls -l dist
      - uses: actions/upload-artifact@v6
        with:
          name: SuperReader2000-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          ## Downloads
          - Android APK: SuperReader2000-${VERSION}.apk
          - Linux RPM (x86_64): SuperReader2000-${VERSION}-x86_64-rpm.rpm
          - Linux RPM (arm64): SuperReader2000-${VERSION}-aarch64-rpm.rpm
          - macOS DMG (arm64): SuperReader2000-${VERSION}-macOS.dmg
          EOF
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --verify-tag --title "SuperReader2000 $VERSION" --notes-file notes.md
          fi
