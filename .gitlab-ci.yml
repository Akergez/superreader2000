stages:
  - build
  - package
  - release

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

.gradle_cache: &gradle_cache
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull-push

# =============================================================================
# Android Build
# =============================================================================
build:android:
  stage: build
  image: eclipse-temurin:21-jdk
  <<: *gradle_cache
  before_script:
    - apt-get update && apt-get install -y git wget unzip
    - export ANDROID_HOME=/opt/android-sdk
    - mkdir -p $ANDROID_HOME/cmdline-tools
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
    - unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
    - mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
    - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
    - yes | sdkmanager --licenses || true
    - sdkmanager "platforms;android-36" "build-tools;36.0.0"
    - |
      if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > $CI_PROJECT_DIR/release.keystore
        export KEYSTORE_PATH=$CI_PROJECT_DIR/release.keystore
        export KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
        export KEY_ALIAS=$KEY_ALIAS
        export KEY_PASSWORD=$KEY_PASSWORD
      fi
  script:
    - chmod +x ./gradlew
    - ./gradlew :superreader2000:assembleRelease
  artifacts:
    name: "SuperReader2000-${VERSION}-apk"
    paths:
      - superreader2000/build/outputs/apk/release/*.apk
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# Linux RPM Build (x86_64)
# =============================================================================
build:linux-x86_64:
  stage: build
  image: fedora:latest
  <<: *gradle_cache
  tags:
    - linux-x86
  variables:
    JAVA_VERSION: "21.0.5+11"
    JAVA_HOME: "$CI_PROJECT_DIR/.jdk"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  before_script:
    - dnf install -y rpm-build curl binutils tar gzip unzip findutils libX11 libXcursor libXrandr libXinerama libXi libXrender mesa-libEGL mesa-libGL
    - |
      curl -L -o jdk.tar.gz \
        https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.5%2B11/OpenJDK21U-jdk_x64_linux_hotspot_21.0.5_11.tar.gz
    - mkdir -p .jdk
    - tar -xzf jdk.tar.gz --strip-components=1 -C .jdk
    - export PATH="$JAVA_HOME/bin:$PATH"
  script:
    - ./gradlew desktopApp:packageReleaseRpm
  artifacts:
    name: "SuperReader2000-${VERSION}-x86_64-rpm"
    paths:
      - desktopApp/build/compose/binaries/main-release/rpm/*.rpm
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# Linux RPM Build (arm64)
# =============================================================================
build:linux-arm64:
  stage: build
  image: fedora:latest
  <<: *gradle_cache
  tags:
    - linux-arm64
  variables:
    JAVA_VERSION: "21.0.5+11"
    JAVA_HOME: "$CI_PROJECT_DIR/.jdk"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  before_script:
    - dnf install -y rpm-build curl binutils tar gzip unzip findutils libX11 libXcursor libXrandr libXinerama libXi libXrender mesa-libEGL mesa-libGL
    - |
      curl -L -o jdk.tar.gz \
        https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.5%2B11/OpenJDK21U-jdk_aarch64_linux_hotspot_21.0.5_11.tar.gz
    - mkdir -p .jdk
    - tar -xzf jdk.tar.gz --strip-components=1 -C .jdk
    - export PATH="$JAVA_HOME/bin:$PATH"
  script:
    - ./gradlew desktopApp:packageReleaseRpm
  artifacts:
    name: "SuperReader2000-${VERSION}-arm64-rpm"
    paths:
      - desktopApp/build/compose/binaries/main-release/rpm/*.rpm
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# macOS DMG Build (arm64)
# =============================================================================
build:macos-arm64:
  stage: build
  <<: *gradle_cache
  tags:
    - macos-arm64
  before_script:
    - |
      curl -L -o jdk.tar.gz \
        https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.5%2B11/OpenJDK21U-jdk_aarch64_mac_hotspot_21.0.5_11.tar.gz
      mkdir -p "$CI_PROJECT_DIR/.jdk"
      tar -xzf jdk.tar.gz --strip-components=1 -C "$CI_PROJECT_DIR/.jdk"
    - export JAVA_HOME="$CI_PROJECT_DIR/.jdk/Contents/Home"
    - export PATH="$JAVA_HOME/bin:$PATH"
    - java -version
    - test "$(java -XshowSettings:properties -version 2>&1 | awk '/java.specification.version/ { print $3 }')" = "21"
  script:
    - chmod +x ./gradlew
    - ./gradlew :desktopApp:createDistributable
    - |
      APP_BUNDLE=$(find desktopApp/build/compose/binaries/main/app -maxdepth 1 -name '*.app' -print -quit)
      test -n "$APP_BUNDLE"
      STAGING=$(mktemp -d)
      ditto "$APP_BUNDLE" "$STAGING/$(basename "$APP_BUNDLE")"
      ln -s /Applications "$STAGING/Applications"
      mkdir -p desktopApp/build/compose/binaries/main/dmg
      hdiutil create -volname "SuperReader2000" -srcfolder "$STAGING" -ov -format UDZO "desktopApp/build/compose/binaries/main/dmg/SuperReader2000-${CI_COMMIT_TAG}.dmg"
  artifacts:
    name: "SuperReader2000-${VERSION}-macOS-dmg"
    paths:
      - desktopApp/build/compose/binaries/main/dmg/*.dmg
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# Publish to GitLab Package Registry
# =============================================================================
package:publish:
  stage: package
  image: curlimages/curl:latest
  needs:
    - job: build:android
      artifacts: true
    - job: build:linux-x86_64
      artifacts: true
      optional: true
    - job: build:linux-arm64
      artifacts: true
      optional: true
    - job: build:macos-arm64
      artifacts: true
      optional: true
  script:
    - VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/superreader2000/${VERSION}"
    - |
      # Android
      for file in superreader2000/build/outputs/apk/release/*.apk; do
        [ -f "$file" ] && curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$file" "${PACKAGE_URL}/SuperReader2000-${VERSION}.apk"
      done
    - |
      # Linux RPMs
      for file in desktopApp/build/compose/binaries/main-release/rpm/*.rpm; do
        if [ -f "$file" ]; then
          arch=$(basename "$file" | grep -oE "x86_64|aarch64")
          curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$file" "${PACKAGE_URL}/SuperReader2000-${VERSION}-${arch}-rpm.rpm"
        fi
      done
    - |
      # macOS DMG
      for file in desktopApp/build/compose/binaries/main/dmg/*.dmg; do
        if [ -f "$file" ]; then
          curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$file" "${PACKAGE_URL}/SuperReader2000-${VERSION}-macOS.dmg"
        fi
      done
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# Create GitLab Release
# =============================================================================
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  needs:
    - job: package:publish
  script:
    - echo "Creating release for tag ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "SuperReader2000 $CI_COMMIT_TAG"
    description: |
      ## Downloads
      - Android APK: SuperReader2000-$CI_COMMIT_TAG.apk
      - Linux RPM (x86_64): SuperReader2000-$CI_COMMIT_TAG-x86_64-rpm.rpm
      - Linux RPM (arm64): SuperReader2000-$CI_COMMIT_TAG-aarch64-rpm.rpm
      - macOS DMG (arm64): SuperReader2000-$CI_COMMIT_TAG-macOS.dmg
    assets:
      links:
        - name: "Android APK"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/superreader2000/${CI_COMMIT_TAG}/SuperReader2000-${CI_COMMIT_TAG}.apk"
          link_type: package
        - name: "Linux RPM (x86_64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/superreader2000/${CI_COMMIT_TAG}/SuperReader2000-${CI_COMMIT_TAG}-x86_64-rpm.rpm"
          link_type: package
        - name: "Linux RPM (arm64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/superreader2000/${CI_COMMIT_TAG}/SuperReader2000-${CI_COMMIT_TAG}-aarch64-rpm.rpm"
          link_type: package
        - name: "macOS DMG"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/superreader2000/${CI_COMMIT_TAG}/SuperReader2000-${CI_COMMIT_TAG}-macOS.dmg"
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG
